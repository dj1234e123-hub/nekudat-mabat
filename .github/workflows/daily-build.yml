# בנייה יומית של האתר (2026-11-02): כדי שמספרי הצפיות בכרטיסי הסיפורים יתעדכנו.
# הסקריפט scripts/fetch-views.mjs רץ בכל בנייה ב-Vercel ומושך את הצפיות מ-PostHog,
# אבל בנייה קורית רק כשדוחפים קוד. כאן Vercel מופעל פעם ביום דרך Deploy Hook.
# נדרש סוד אחד בריפו: VERCEL_DEPLOY_HOOK_URL (Vercel > Settings > Git > Deploy Hooks, לענף הראשי).
# בלי הסוד, הפעולה מדלגת ולא נכשלת.
name: daily-build
on:
  schedule:
    - cron: '30 3 * * *' # 03:30 UTC, בלילה בישראל
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "אין VERCEL_DEPLOY_HOOK_URL, מדלג."; exit 0; fi
          curl -fsS -X POST "$HOOK"
