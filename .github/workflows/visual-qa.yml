# בדיקת מראה אוטומטית של האתר החי (שלב 4.114): פעם בשבוע (ראשון 07:00 UTC) ואחרי כל פריסה
# מוצלחת לפרודקשן של Vercel. נכשלה: נפתח Issue "בדיקת מראה נכשלה" (או נוספת הערה לקיים),
# שבעל הפרויקט רואה בטלפון. Playwright מותקן בהרצה בלבד (npm i --no-save), לא נכנס לפרויקט.
name: visual-qa
on:
  schedule:
    - cron: '0 7 * * 0'
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: visual-qa
  cancel-in-progress: true
jobs:
  qa:
    # deployment_status רץ על כל סטטוס; רק פרודקשן שהצליח
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: qa:visual
        id: qa
        run: |
          set +e
          node scripts/qa-visual.mjs https://nekudatmabat.blog --out qa-shots > qa.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat qa.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-shots
          path: qa-shots
          retention-days: 14
      - name: פתיחת Issue בכישלון
        if: steps.qa.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'הבדיקה האוטומטית מצאה בעיות באתר החי.\n\n```\n%s\n```\n\nצילומי מסך: %s/%s/actions/runs/%s\n\nלתיקון: לכתוב לקלוד "בדיקת מחשב".' "$(cat qa.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          n="$(gh issue list --state open --search 'בדיקת מראה נכשלה in:title' --json number --jq '.[0].number')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "בדיקת מראה נכשלה" --body "$body"; fi
      - name: כישלון
        if: steps.qa.outputs.code != '0'
        run: exit 1
