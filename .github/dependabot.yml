# התראה על עדכוני תלויות. בלי זה אף אחד לא מודיע כשמתגלה בעיית אבטחה
# בחבילה שהאתר נשען עליה — והבדיקה נעשית רק כשמישהו נזכר לבדוק.
# חודשי ולא שבועי: אתר תוכן של אדם אחד, ורעש של בקשות משיכה שבועיות
# מתחיל להיות מתעלמים ממנו — וזה גרוע יותר מהיעדרו.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'תלויות'
